<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css?v=3" />
    <title>APP NOTIFICATIONS</title>
  </head>
  <body>
    <div id="contenedor-gral" class="roboto">

      <!-- ============================================ -->
      <!-- PANTALLA 1: LOCKSCREEN (tap para desbloquear) -->
      <!-- En la instalación la desbloquea la app de la notebook -->
      <!-- ============================================ -->
      <div id="pantalla-1" class="disp">
        <!-- Hora y fecha -->
        <div id="lock-content">
          <h1 class="hora-lock lock-hora-grande">14:30</h1>
          <h3 id="fecha-lock">martes 9 de diciembre</h3>
        </div>
      </div>

      <!-- ============================================ -->
      <!-- PANTALLA 2: HOME SCREEN desbloqueado + notis -->
      <!-- ============================================ -->
      <div id="pantalla-2" class="no-disp">

        <!-- Contenedor de notificaciones (caen desde arriba) -->
        <div id="notification-container"></div>

        <!-- Barra de búsqueda Google (arriba de las apps) -->
        <div id="google-search-bar">
          <div class="search-bar-inner">
            <span class="search-g">G</span>
            <span class="search-placeholder">Buscar</span>
            <svg class="search-mic" viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="3" width="6" height="11" rx="3" fill="#4285F4"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="#EA4335" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          </div>
        </div>

        <!-- Dock: las cinco apps de donde llegan las notificaciones -->
        <div id="home-screen">
          <div class="dk"><img src="assets/imgs/icono-wtsap.png" alt="WhatsApp" class="dk-ic dk-wa" /><span class="badge" id="badge-whatsapp" style="display:none;">0</span></div>
          <div class="dk"><img src="assets/imgs/icono-gmail.svg" alt="Gmail" class="dk-ic" /><span class="badge" id="badge-gmail" style="display:none;">0</span></div>
          <div class="dk"><img src="assets/imgs/icono-banco.png" alt="Galicia" class="dk-ic" /><span class="badge" id="badge-banco" style="display:none;">0</span></div>
          <div class="dk"><img src="assets/imgs/icono-obrasocial.svg" alt="Obra social" class="dk-ic" /><span class="badge" id="badge-obrasocial" style="display:none;">0</span></div>
          <div class="dk"><img src="assets/imgs/icono-calendario.svg" alt="Calendario" class="dk-ic" /><span class="badge" id="badge-calendario" style="display:none;">0</span></div>
        </div>

      </div>
    </div>

    <script src="assets/js/datos-notificaciones.js?v=3"></script>
    <script src="assets/js/websocket-client.js?v=3"></script>
    <script src="assets/js/main.js?v=3"></script>
  </body>
</html>
